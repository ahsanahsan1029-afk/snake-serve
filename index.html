<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyberpunk Snake Game</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0d0e15; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #login-screen { position: absolute; z-index: 10; background: #0f111a; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
    #login-screen h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
    #login-screen input { padding: 12px 20px; border-radius: 25px; border: 2px solid #00ffcc; background: transparent; color: #fff; text-align: center; outline: none; }
    #login-screen button { padding: 12px 30px; border-radius: 25px; border: none; background: #00ffcc; font-weight: bold; cursor: pointer; }
    canvas { background: #141622; border: 2px solid #00ffcc; border-radius: 8px; max-width: 95vw; max-height: 50vh; }
    #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 6px; font-size: 0.8rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 10px; margin-top: 15px; }
    .btn { background: #1f2338; border: 2px solid #00ffcc; color: #00ffcc; border-radius: 50%; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>ONLINE SNAKE 🐍</h1>
    <input type="text" id="username" placeholder="Apna Name Likhein" maxlength="10">
    <button onclick="startGame()">PLAY GAME</button>
  </div>

  <div style="position: relative;">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <div id="leaderboard">
      <h4 style="color:#00ffcc;">SCORES</h4>
      <div id="player-list"></div>
    </div>
  </div>

  <!-- Touch Controls -->
  <div class="controls">
    <div class="btn btn-up" onclick="sendDir('UP')">▲</div>
    <div class="btn btn-left" onclick="sendDir('LEFT')">◄</div>
    <div class="btn btn-right" onclick="sendDir('RIGHT')">►</div>
    <div class="btn btn-down" onclick="sendDir('DOWN')">▼</div>
  </div>

  <script>
    // APNA RENDER URL YAHAN DAALEIN:
    const SERVER_URL = "https://my-online-snake-game.onrender.com/"; 
    
    const socket = io(SERVER_URL);
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let myId = null;

    function startGame() {
      const name = document.getElementById('username').value;
      if (!name) return alert("Naam likhna zaroori hai!");
      document.getElementById('login-screen').style.display = 'none';
      socket.emit('joinGame', name);
    }

    socket.on('init', (data) => { myId = data.id; });

    socket.on('gameState', (state) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Food
      if (state.food) {
        ctx.fillStyle = state.food.color;
        ctx.fillRect(state.food.x, state.food.y, 18, 18);
      }

      // Draw Snakes
      let leaderData = [];
      for (let id in state.players) {
        let p = state.players[id];
        leaderData.push({ name: p.name, score: p.score });

        ctx.fillStyle = p.color;
        p.tail.forEach(seg => ctx.fillRect(seg.x, seg.y, 18, 18));
        ctx.fillRect(p.x, p.y, 18, 18);

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(p.name, p.x - 5, p.y - 5);
      }

      // Update Leaderboard
      document.getElementById('player-list').innerHTML = leaderData
        .sort((a,b) => b.score - a.score)
        .slice(0, 5)
        .map(p => `<div>${p.name}: ${p.score}</div>`).join('');
    });

    function sendDir(dir) { socket.emit('direction', dir); }
  </script>
</body>
</html>
